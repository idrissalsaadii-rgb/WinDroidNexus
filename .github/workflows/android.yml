name: Build APK

# Builds an installable debug APK on GitHub's runners (which have the Android
# SDK preinstalled and full network access). The finished app-debug.apk is
# uploaded as a downloadable artifact on every push and on manual run.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you trigger a build by hand from the Actions tab

permissions:
  contents: write   # needed to publish the APK as a Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Use the SDK preinstalled on the runner instead of a third-party action,
      # accepting licenses deterministically and installing the exact packages.
      - name: Accept licenses & install Android SDK packages
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinDroidNexus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the APK as a Release asset so it has a direct, installable
      # download link (artifacts are zipped and awkward to grab on mobile).
      - name: Publish APK to Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create debug-latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "WinDroid Nexus — debug APK" \
            --notes "Auto-built installable debug APK. On Android, open this page, download the .apk, and allow 'install unknown apps'." \
            --latest

      # Also drop the APK on an orphan branch so it can be fetched over git.
      - name: Push APK to build-artifacts branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/apkout
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/WinDroidNexus-debug.apk
          cd /tmp/apkout
          git init -q
          git config user.name "windroid-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b build-artifacts
          git add WinDroidNexus-debug.apk
          git commit -q -m "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-artifacts
